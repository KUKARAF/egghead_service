version: '3.8'

services:
  egghead:
    image: ghcr.io/kukaraf/egghead_service:latest
    container_name: egghead_service
    restart: unless-stopped

    # Environment from .env file (secrets)
    env_file: .env

    # Public/shared config (no secrets here)
    environment:
      DATABASE_URL: sqlite:./data/egghead.db
      LISTEN_ADDR: 0.0.0.0:3000
      BASE_URL: https://userscripts.osmosis.page
      OIDC_ISSUER_URL: https://auth.osmosis.page/application/o/userscripts/
      KV_URL: https://kv.osmosis.page
      WORKER_POLL_INTERVAL_SECS: "5"
      MAX_HTML_BYTES: "2000000"
      LOG_FORMAT: "json"

    # Port exposed to network (192.168.1.66:3088)
    ports:
      - "192.168.1.66:3088:3000"

    # DNS configuration (AdGuard with DNS rewrite for *.osmosis.page)
    dns:
      - 192.168.1.66

    # Persistent SQLite database and generated scripts (local bind mounts)
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts

    # Health check for orchestration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging to Loki
    logging:
      driver: loki
      options:
        loki-url: "http://192.168.1.66:3100/loki/api/v1/push"
        loki-external-labels: "service=egghead,compose_service=egghead"
